<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASF Desafios — Desafios semanais de surf</title>
<meta name="description" content="Desafios semanais da comunidade ASF com XP, níveis e streak. Satélite do app ASF.">
<link rel="canonical" href="https://acarolmourad-commits.github.io/asf-desafios/">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f0fdf4;color:#14532d}header{background:#16a34a;color:#fff;padding:2rem;text-align:center}nav{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:1rem;background:#dcfce7}nav a{color:#15803d;text-decoration:none;font-size:.85rem}main{max-width:640px;margin:2rem auto;padding:0 1rem}.card{background:#fff;border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}.des{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem;border-bottom:1px solid #dcfce7}.des input{width:20px;height:20px;margin-top:3px}button{background:#16a34a;color:#fff;border:0;border-radius:9999px;padding:.7rem 1.4rem;font-weight:700;cursor:pointer}.bar{background:#dcfce7;border-radius:9999px;height:14px}.bar i{display:block;background:#16a34a;height:100%;transition:width .4s}footer{text-align:center;padding:2rem;color:#525252}</style>
</head>
<body>
<header><h1>ASF Desafios 🎯</h1><p>Um desafio por semana. XP, streak e glória.</p></header>
<nav id="net"></nav>
<main>
<div class="card"><h2>🏅 Seu progresso</h2><p id="lvl"></p><div class="bar"><i id="bar" style="width:0"></i></div><p id="streak"></p></div>
<div class="card" id="list"></div>
<div class="card"><p>Complete desafios e some XP no <a href="https://acarolmourad-commits.github.io/asf-ranking/">Ranking</a>, pratique a técnica no <a href="https://acarolmourad-commits.github.io/asf-manobras/">ASF Manobras</a> e registre tudo no <a href="https://acarolmourad-commits.github.io/asf-diario/">Diário</a>.</p></div>
</main>
<footer>ASF Desafios — satélite do <a href="https://acarolmourad-commits.github.io/asf-app/">app ASF</a></footer>
<script>
const sites=[["asf-app","App ASF"],["asf-praias","Praias"],["asf-previsao","Previsão"],["asf-treino","Treino"],["asf-eventos","Eventos"],["asf-comunidade","Comunidade"],["asf-quiz","Quiz"],["asf-ranking","Ranking"],["asf-diario","Diário"],["asf-manobras","Manobras"],["asf-apnea","Apneia"],["asf-yoga","Yoga"],["asf-nutricao","Nutrição"],["asf-galeria","Galeria"],["asf-parceiras","Parceiras"]];
document.getElementById('net').innerHTML=sites.map(s=>`<a href="https://acarolmourad-commits.github.io/${s[0]}/">${s[1]}</a>`).join('');
const D=[["Entre no mar 3x na semana",50],["Surfe 1h em dawn patrol",40],["Acerte 5 take-offs seguidos",60],["Ensine algo a uma iniciante",80],["Faça 10 min de respiração (ASF Respira)",30],["Aprenda um termo novo no Glossário",20],["Participe de um mutirão ASF Eco",100],["Complete uma tabela de apneia",70]];
function load(){return JSON.parse(localStorage.getItem('asf-desafios')||'[]');}
function render(){const d=load();const xp=D.filter((_,i)=>d.includes(i)).reduce((s,x)=>s+x[1],0);const tot=D.reduce((s,x)=>s+x[1],0);
document.getElementById('lvl').textContent=`${xp} XP de ${tot}`;document.getElementById('bar').style.width=(100*xp/tot)+'%';
document.getElementById('streak').textContent=xp>=tot?'👑 SEMANA PERFEITA!':xp>=200?'🔥 Quase lá!':'🌊 Bora completar!';
document.getElementById('list').innerHTML='<h2>📅 Desafios da semana</h2>'+D.map((x,i)=>`<label class="des"><input type="checkbox" ${d.includes(i)?'checked':''} onchange="t(${i})"><span>${x[0]} <b>+${x[1]} XP</b></span></label>`).join('');}
function t(i){let d=load();d=d.includes(i)?d.filter(x=>x!==i):[...d,i];localStorage.setItem('asf-desafios',JSON.stringify(d));render();}
render();
</script>
</body>
</html>
