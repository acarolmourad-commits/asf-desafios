<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Desafios — Desafios semanais com XP | ASF</title><meta name="description" content="Desafios semanais da comunidade ASF com XP e níveis: complete missões de surf e evolua de Marolinha a Tsunami. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-desafios/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:40px 20px 30px;text-align:center}.wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px}.lvl{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;text-align:center;box-shadow:0 2px 8px rgba(14,36,57,.06)}.bar{background:#E5EEF2;border-radius:99px;height:12px;overflow:hidden;margin:8px 0}.bar div{background:linear-gradient(90deg,var(--p),var(--u));height:100%;transition:width .3s}.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(14,36,57,.06)}label{display:flex;gap:10px;padding:4px 0;font-size:14.5px;cursor:pointer}input{accent-color:var(--p)}.muted{color:var(--g);font-size:12.5px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-desafios/">🎯 Desafios</a><a href="https://acarolmourad-commits.github.io/asf-ranking/">🏆 Ranking</a><a href="https://acarolmourad-commits.github.io/asf-quiz/">❓ Quiz</a><a href="https://acarolmourad-commits.github.io/asf-desafio/">📈 Desafio 30</a></nav><header><h1>🎯 Desafios da semana</h1><p>Complete missões, ganhe XP e suba de nível na comunidade.</p></header><main class="wrap"><div class="lvl"><strong id="nivel">Marolinha 🌊</strong><div class="bar"><div id="bar" style="width:0%"></div></div><div class="muted"><span id="xp">0</span> XP desta semana</div></div><div id="lista"></div><p class="muted">Seu XP fica salvo neste navegador. Dispute no <a href="https://acarolmourad-commits.github.io/asf-ranking/" style="color:var(--p)">ASF Ranking</a>.</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a></footer><script>const desafios=[['Surfar 2 sessões na semana',40],['Fazer o checklist pré-surf completo',15],['Treinar pop-up 3x em casa',20],['Aprender 5 termos novos no Glossário',15],['Levar uma amiga para surfar',30],['Assistir 1 workshop ou guia de segurança',20],['Ajudar em 1 mutirão ou ação eco',40]];const niveis=[[0,'Marolinha 🌊'],[50,'Quebra-coco 🏄‍♀️'],[100,'Local 🌺'],[150,'Tsunami 🌪️']];const K='asf-desafios-v1';let st=JSON.parse(localStorage.getItem(K)||'{}');const lista=document.getElementById('lista');desafios.forEach((d,i)=>lista.insertAdjacentHTML('beforeend',`<div class="card"><label><input type="checkbox" data-i="${i}" ${st[i]?'checked':''}> ${d[0]} <span class="muted">+${d[1]} XP</span></label></div>`));function att(){let xp=0;desafios.forEach((d,i)=>st[i]&&(xp+=d[1]));document.getElementById('xp').textContent=xp;document.getElementById('bar').style.width=Math.min(100,xp/150*100)+'%';let n=niveis[0][1];niveis.forEach(l=>xp>=l[0]&&(n=l[1]));document.getElementById('nivel').textContent=n;}lista.onchange=e=>{st[e.target.dataset.i]=e.target.checked;localStorage.setItem(K,JSON.stringify(st));att();};att();</script></body></html>
